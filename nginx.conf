# Nginx configuration for AgriPool
# Location: /etc/nginx/sites-available/agripool
# Enable with: ln -s /etc/nginx/sites-available/agripool /etc/nginx/sites-enabled/agripool
#
# Directory layout on server:
#   /var/www/agripool/
#   ├── agripool/          ← Laravel root
#   │   └── public/
#   │       ├── index.php  ← Laravel entry point
#   │       └── frontend/  ← React build (Vite dist)
#   └── frontend/          ← React source (not served directly)

# ── HTTP → HTTPS redirect (Certbot will add after SSL is issued) ──────────
server {
    listen 80;
    listen [::]:80;
    server_name agripool.example.com www.agripool.example.com;
    return 301 https://$host$request_uri;
}

# ── HTTPS main block ────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name agripool.example.com www.agripool.example.com;

    # SSL certificates (managed by Certbot)
    ssl_certificate     /etc/letsencrypt/live/agripool.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/agripool.example.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Frame-Options           "SAMEORIGIN"               always;
    add_header X-XSS-Protection          "1; mode=block"            always;
    add_header X-Content-Type-Options    "nosniff"                  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(self)" always;

    # ── Rate limiting for API ───────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;

    # ── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml+rss
        image/svg+xml font/truetype font/opentype;
    gzip_min_length 256;

    client_max_body_size 20M;

    # ── Logging ─────────────────────────────────────────────────────────────
    access_log /var/log/nginx/agripool-access.log;
    error_log  /var/log/nginx/agripool-error.log warn;

    # ────────────────────────────────────────────────────────────────────────
    # Laravel API  →  /api/**
    # All requests starting with /api are forwarded to PHP-FPM.
    # ────────────────────────────────────────────────────────────────────────
    location /api {
        root       /var/www/agripool/agripool/public;
        index      index.php;
        try_files  $uri $uri/ /index.php?$query_string;

        # Rate limiting on API
        limit_req zone=api burst=20 nodelay;

        # PHP-FPM
        location ~ \.php$ {
            fastcgi_pass              unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_index             index.php;
            fastcgi_param             SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include                   fastcgi_params;
            fastcgi_hide_header       X-Powered-By;
            fastcgi_read_timeout      60;
            fastcgi_buffer_size       16k;
            fastcgi_buffers           4 16k;
        }
    }

    # ── Laravel public files (storage symlink, etc.) ─────────────────────
    location /storage {
        root      /var/www/agripool/agripool/public;
        try_files $uri =404;
        expires   30d;
        add_header Cache-Control "public";
    }

    # ────────────────────────────────────────────────────────────────────────
    # React SPA  →  everything else
    # Vite-built assets go here; all unknown routes fall back to index.html
    # so that React Router can handle client-side navigation.
    # ────────────────────────────────────────────────────────────────────────
    location / {
        root       /var/www/agripool/agripool/public/frontend;
        index      index.html;
        try_files  $uri $uri/ /index.html;

        # Vite fingerprints assets (hash in filename) → aggressive caching
        location ~* \.(js|css|woff2|woff|ttf|otf|eot)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
        }

        # Images & icons — shorter cache
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires    30d;
            add_header Cache-Control "public";
        }
    }

    # ── Block sensitive files ────────────────────────────────────────────
    location ~ /\.(ht|git|env) {
        deny all;
        return 404;
    }

    # ── Block xmlrpc / common scan targets ──────────────────────────────
    location = /xmlrpc.php { deny all; return 404; }
    location = /wp-login.php { deny all; return 404; }
}
