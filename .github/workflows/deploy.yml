name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run PHPUnit Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: agripool_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, xml, bcmath, curl, zip, intl, pdo_mysql
        coverage: none
        
    - name: Install Composer Dependencies
      working-directory: ./agripool
      run: composer install --prefer-dist --no-progress --no-suggest
      
    - name: Prepare Laravel Environment
      working-directory: ./agripool
      run: |
        cp .env.example .env
        php artisan key:generate
        
    - name: Run Migrations
      working-directory: ./agripool
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: agripool_test
        DB_USERNAME: root
        DB_PASSWORD: ""
      run: php artisan migrate --force
      
    - name: Execute Tests
      working-directory: ./agripool
      env:
        DB_CONNECTION: mysql
        DB_HOST: 127.0.0.1
        DB_PORT: 3306
        DB_DATABASE: agripool_test
        DB_USERNAME: root
        DB_PASSWORD: ""
      run: vendor/bin/phpunit --testdox

  deploy:
    name: Deploy to Production VPS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Execute remote redeploy script via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || '22' }}
        script: |
          # The redeploy.sh script lives in the repo, but the server needs to run it as sudo
          cd /var/www/agripool
          sudo bash redeploy.sh
